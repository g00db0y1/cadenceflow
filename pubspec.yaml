name: cadenceflow
description: >-
  CadenceFlow — Cloud-synced, offline-first productivity app combining
  Eisenhower Matrix task prioritization, 5-tier recurring Cadence Goals,
  and social-media-style persistent appointment reminders (Flutter + Supabase + Clerk Auth).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Cloud Backend & Auth
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  # Offline-First Local Mirror
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0
  # Persistent Notifications & Exact Alarms
  flutter_local_notifications: ^18.0.1
  android_alarm_manager_plus: ^4.0.6
  timezone: ^0.10.0
  # Typography & UI
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
