name: CadenceFlow Fast Quality Gates & 5-Suite CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Cancel superseded runs immediately to conserve GitHub Actions resources
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security-and-asset-gates:
    name: Gate 1 — Static, RLS, Icon & Architecture Verification
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute 7-Layer Pre-Push & Architecture Gate
        run: python3 scripts/pre_push_gate.py

  analyze-and-test:
    name: Gate 2 — Flutter Analyze & 5-Suite Unit/Widget Tests
    needs: static-security-and-asset-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap platform scaffolding & restore tracked sources
        run: |
          flutter create --platforms=android,web --org com.cadenceflow --project-name cadenceflow .
          git checkout -- .
          git clean -fd lib/ test/
          flutter pub get

      - name: Verify static analysis (Zero Warnings/Errors)
        run: flutter analyze --no-fatal-infos

      - name: Run all 5 unit & widget test suites
        run: flutter test --reporter expanded
