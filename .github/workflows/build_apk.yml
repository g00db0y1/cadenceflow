name: CadenceFlow Manual APK Builder (Debug & Protected Main Release)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Variant (Note: release builds are strictly restricted to the main branch)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: apk-build-${{ github.ref }}-${{ inputs.build_type }}
  cancel-in-progress: true

jobs:
  branch-and-quality-gate:
    name: Gate — Verify Branch Policy & 7-Layer Integrity Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Enforce Main-Branch-Only Policy for Release APK Builds
        run: |
          echo "Requested build_type: ${{ inputs.build_type }}"
          echo "Triggered on ref: ${{ github.ref }}"
          if [ "${{ inputs.build_type }}" = "release" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Release APK builds are strictly restricted to the protected 'main' branch (current ref: ${{ github.ref }})."
            exit 1
          fi
          echo "✅ Branch policy check passed."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute 7-Layer Pre-Push & Architecture Gate
        run: python3 scripts/pre_push_gate.py

  build-android-apk:
    name: Build Android ${{ inputs.build_type }} APK (itel Power 70)
    needs: branch-and-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap platform scaffolding & apply custom CadenceFlow launcher icons
        run: |
          flutter create --platforms=android,web --org com.cadenceflow --project-name cadenceflow .
          git checkout -- .
          git clean -fd lib/ test/
          rm -f android/app/src/main/res/drawable*/ic_launcher*
          python3 scripts/configure_android_gradle.py
          flutter pub get

      - name: Verify static analysis & all 5 test suites before packaging
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Android ${{ inputs.build_type }} APK
        run: |
          flutter build apk --${{ inputs.build_type }} \
            --dart-define=CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY || 'pk_test_PLACEHOLDER' }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'placeholder_anon_key' }}

      - name: Upload CadenceFlow Android ${{ inputs.build_type }} APK
        uses: actions/upload-artifact@v4
        with:
          name: cadenceflow-android-${{ inputs.build_type }}-apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk
